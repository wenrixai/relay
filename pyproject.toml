[project]
name = "channel-relay"
version = "0.1.0"
description = "Wenrix Channel Relay v2 — privacy-first transparent relay for travel channels."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.3",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.15.0",
    "loguru>=0.7",
    "lxml>=5.3",
    "cryptography>=50.0.0",
    "opentelemetry-sdk>=1.43.0",
    "opentelemetry-exporter-otlp>=1.44.0",
    "pybase64>=1.4.3",
    "opentelemetry-instrumentation-fastapi>=0.64b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "uvloop>=0.22",
    "httptools>=0.6",
]

[project.scripts]
channel-relay = "channel_relay.main:cli"

[dependency-groups]
dev = [
    "ruff>=0.16.3",
    "mypy>=2.3.1",
    "pylint>=3.3",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "pytest-cov>=6.0",
    "pytest-fail-slow>=0.6",
    "pytest-xdist>=3.6",
    "pre-commit>=4.6.1",
    "lxml-stubs>=0.5",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/channel_relay"]

# --- ruff -------------------------------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pylint.main]
py-version = "3.13"
jobs = 0
# lxml is a C extension; allow runtime introspection so etree members resolve.
extension-pkg-allow-list = ["lxml.etree", "lxml"]
[tool.pylint.format]
max-line-length = 120

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--strict-markers --strict-config --cov --cov-report=term-missing --fail-slow=500ms"
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 60
filterwarnings = [
    "error",
    # Third-party deprecation we don't control (starlette TestClient on httpx).
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    # The OTel SDK LoggingHandler is the canonical Loguru->OTLP log bridge; its suggested
    # replacement (opentelemetry-instrumentation-logging) only injects trace context, it does
    # not export logs. The logs SDK is still unstable upstream — revisit when it stabilizes.
    "ignore:`LoggingHandler` in `opentelemetry-sdk` is deprecated:DeprecationWarning",
]
markers = [
    "e2e: end-to-end tests against local mock channels (slower subset).",
    "integration: integration tests spanning multiple components.",
]

[tool.coverage.run]
source = ["src/channel_relay"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "\\.\\.\\."]
