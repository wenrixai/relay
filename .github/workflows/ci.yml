name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      test: ${{ steps.filter.outputs.test }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Filter
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            test:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'

  quality:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.26"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync (frozen)
        run: uv sync --frozen

      # The terraform_fmt / terraform_validate hooks shell out to this binary. It happens to be
      # present on ubuntu-latest, but pin it rather than depend on the runner image.
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: pre-commit
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files

  test:
    name: pytest
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.test == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.26"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync (frozen)
        run: uv sync --frozen

      - name: pytest (timeout + coverage gate)
        run: uv run pytest -n auto --timeout=60 --cov=src --cov-report=term-missing --cov-fail-under=85

  image:
    name: Build image + readiness smoke
    runs-on: ubuntu-latest
    needs: [quality, test]
    if: always() && needs.quality.result == 'success' && needs.test.result != 'failure' && needs.test.result != 'cancelled'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build relay image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: wenrix-relay:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run readiness smoke test
        run: |
          echo '{"channels":[]}' > relay.json
          docker run -d --name relay \
            -p 8080:8080 \
            -e RELAY_BASIC_AUTH_USER=smoke \
            -e RELAY_BASIC_AUTH_PASS=smoke \
            -v "$PWD/relay.json:/etc/wenrix/relay.json:ro" \
            wenrix-relay:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/readiness; then
              echo "readiness OK"
              exit 0
            fi
            sleep 1
          done
          echo "readiness smoke test failed"
          docker logs relay
          exit 1

      - name: Tear down
        if: always()
        run: docker rm -f relay || true

  push-image:
    name: Push image to GHCR
    runs-on: ubuntu-latest
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/wenrix-relay
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Derive short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.sha.outputs.short }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
