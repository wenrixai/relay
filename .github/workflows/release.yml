name: Release

on:
  push:
    tags:
      - "v*"

# Least privilege: elevated scopes are granted per-job only.
permissions:
  contents: read

jobs:
  release:
    name: Build, push, and release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      packages: write # push image + OCI chart to GHCR
      id-token: write # keyless cosign (OIDC)
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/wenrix-relay
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for the changelog

      - name: Derive version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${IMAGE_NAME}:${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.version.outputs.image }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM (syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.version.outputs.image }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Install cosign
        if: vars.COSIGN_ENABLED == 'true'
        uses: sigstore/cosign-installer@v4

      - name: Sign image (keyless)
        if: vars.COSIGN_ENABLED == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Bump chart version and package
        id: chart
        run: |
          version="${{ steps.version.outputs.version }}"
          sed -i -E "s/^version:.*/version: ${version}/" deployment/helm/chart/Chart.yaml
          sed -i -E "s/^appVersion:.*/appVersion: \"${version}\"/" deployment/helm/chart/Chart.yaml
          helm package deployment/helm/chart --version "${version}" --app-version "${version}" -d dist
          echo "chart=dist/wenrix-relay-${version}.tgz" >> "$GITHUB_OUTPUT"

      - name: Push chart to GHCR (OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "${REGISTRY}" -u "${{ github.actor }}" --password-stdin
          helm push "${{ steps.chart.outputs.chart }}" "oci://${REGISTRY}/${{ github.repository_owner }}/charts"

      - name: Generate changelog
        id: changelog
        run: |
          prev="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$prev" ]; then
            range="${prev}..${GITHUB_REF_NAME}"
          else
            range="${GITHUB_REF_NAME}"
          fi
          {
            echo "## Changes"
            git log --no-merges --pretty=format:'- %s (%h)' "$range"
          } > CHANGELOG_RELEASE.md
          cat CHANGELOG_RELEASE.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: CHANGELOG_RELEASE.md
          files: |
            sbom.spdx.json
            ${{ steps.chart.outputs.chart }}
