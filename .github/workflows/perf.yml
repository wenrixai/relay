name: Perf

# Load/perf harness (PROJECT.md §13.4). Non-gating: publishes a summary artifact and never fails
# the build on threshold breaches. Runs on demand and weekly.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  k6:
    name: k6 load test (${{ matrix.payload_size }} bytes)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        payload_size: [2048, 32768, 262144]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.26"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync (frozen)
        run: uv sync --frozen

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6

      - name: Start mock upstream (fixed 50ms latency)
        run: |
          MOCK_PORT=9000 \
          MOCK_LATENCY_MS=50 \
          MOCK_BODY_FILE=perf/mock-response.xml \
          MOCK_CONTENT_TYPE=application/xml \
          MOCK_EXPECTED_LOGIN=perf-login \
          MOCK_EXPECTED_ROUNDTRIP=PERF_ROUNDTRIP_PLAINTEXT \
          uv run python deployment/mock_channel.py &
          sleep 1

      - name: Generate ephemeral perf key
        run: |
          key_b64="$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$key_b64"
          printf 'RELAY_PII_KEYRING=%s\n' "$key_b64" >> "$GITHUB_ENV"

      - name: Start relay
        run: |
          RELAY_CONFIG_FILE=perf/relay.perf.json \
          RELAY_BASIC_AUTH_ENABLED=false \
          uv run uvicorn channel_relay.main:app --port 8080 &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/readiness && break
            sleep 1
          done

      - name: Preflight measured stages
        run: uv run python perf/preflight.py --token-output /tmp/perf-roundtrip-token

      - name: Run k6
        # Non-gating: do not fail the job on threshold breaches.
        continue-on-error: true
        run: |
          k6 run \
            -e RELAY_URL=http://127.0.0.1:8080 \
            -e PAYLOAD_SIZE=${{ matrix.payload_size }} \
            -e ROUNDTRIP_TOKEN="$(cat /tmp/perf-roundtrip-token)" \
            -e SUMMARY_PATH=summary-${{ matrix.payload_size }}.json \
            perf/relay-load.js

      - name: Upload summary
        uses: actions/upload-artifact@v7
        with:
          name: k6-summary-${{ matrix.payload_size }}
          path: summary-${{ matrix.payload_size }}.json
          if-no-files-found: warn
