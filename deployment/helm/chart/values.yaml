# Default values for wenrix-relay.
# Secure-by-default (PROJECT.md §13.5). Override per environment.

image:
  repository: ghcr.io/wenrixai/wenrix-relay
  # Defaults to .Chart.appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Number of replicas when autoscaling is disabled. With autoscaling enabled this is ignored.
replicaCount: 2

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

# --- Relay process configuration (RELAY_* env). Non-secret scalars only. ---
# Secrets (PII keyring, TLS, basic auth) come from Kubernetes Secrets — never set them here.
config:
  port: 8080
  # Context path the relay serves all routes under, behind an LB routing rule
  # (https://<lb>:443/<rootPath>/...). Empty = root-only serving (the default). The relay
  # tolerates both LB behaviors (prefix forwarded or stripped), so k8s probes stay unprefixed
  # (they hit the pod directly). Set the matching path rule on your LB listener.
  rootPath: ""
  # Rendered into a ConfigMap and mounted at /etc/wenrix/relay.json. No secrets.
  channels:
    - name: mock
      type: travelport
      proxy_pass: http://mock-channel:9000
  env:
    RELAY_BASIC_AUTH_ENABLED: "true"
    RELAY_DEFAULT_CONNECT_TIMEOUT: "30"
    RELAY_DEFAULT_READ_TIMEOUT: "120"
    RELAY_MAX_INSPECT_BYTES: "8388608"
    RELAY_TELEMETRY_METRICS_ENABLED: "true"
    # Traces are opt-in (off by default); when enabled they export to the same OTLP endpoint.
    RELAY_TELEMETRY_TRACES_ENABLED: "false"
  # OTLP/gRPC telemetry endpoint. Use http:// for a plaintext collector.
  telemetry:
    otlpEndpoint: ""

# --- PII master-key Secret (PROJECT.md §13.2, §8.3) ---
# Created create-if-absent by a normal template guarded by `lookup`; NEVER regenerated on `helm upgrade`.
# Keyring source: a single base64(32-byte) master key. Key rotation is not handled by the relay;
# it will be reintroduced later through a dedicated KMS store plugin.
piiKeyring:
  enabled: true
  # Name of the Secret holding the keyring file. Defaults to <fullname>-pii-keyring.
  secretName: ""
  # Key within the Secret and the mount path wired to RELAY_PII_KEYRING_FILE.
  # Kept as keyring.json for backward compatibility with existing Secrets (holds a bare key now).
  key: keyring.json
  mountPath: /etc/wenrix/keys
  # When true, a plain (non-hook) template guarded by a `lookup` generates the key only if the
  # Secret is absent. `lookup` needs install-time RBAC and always returns empty under offline
  # rendering (`helm template`, GitOps controllers) — see README's GitOps section before using this
  # with ArgoCD/Flux, or set piiKeyring.secretName to an externally-managed Secret instead.
  createIfAbsent: true

# --- Basic auth (optional). Credentials from a Secret, never from values/ConfigMap. ---
basicAuth:
  enabled: true
  # Secret with keys `user` and `pass`. If empty, set RELAY_BASIC_AUTH_* another way.
  secretName: ""

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: "1000m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "512Mi"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  # Optional RPS-based scaling. Off (0) by default: requires a custom-metrics adapter exposing the
  # http_server_requests_per_second metric; no scrape surface exists yet (serviceMonitor is inert).
  targetRequestsPerSecond: 0

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceMonitor:
  # OFF by default: the app is OTLP-push only and exposes no Prometheus scrape endpoint yet.
  # Enable once a /metrics scrape surface exists (tracked as follow-up).
  enabled: false
  interval: 30s
  path: /metrics
  port: http

# Pod-level securityContext.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

# Container-level securityContext.
securityContext:
  runAsNonRoot: true
  runAsUser: 100
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

livenessProbe:
  httpGet:
    path: /liveness
    port: http
  initialDelaySeconds: 5
  periodSeconds: 30
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readiness
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}
