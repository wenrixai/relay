# Default values for wenrix-relay.
# Secure-by-default (PROJECT.md §13.5). Override per environment.

image:
  repository: ghcr.io/wenrixai/wenrix-relay
  # Defaults to .Chart.appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Number of replicas when autoscaling is disabled. With autoscaling enabled this is ignored.
replicaCount: 2

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

# --- Relay process configuration (RELAY_* env). Non-secret scalars only. ---
# Secrets (PII keyring, TLS, basic auth) come from Kubernetes Secrets — never set them here.
config:
  port: 8080
  # Rendered into a ConfigMap and mounted at /etc/wenrix/relay.json. No secrets.
  channels:
    - name: mock
      type: travelport
      proxy_pass: http://mock-channel:9000
  env:
    RELAY_BASIC_AUTH_ENABLED: "true"
    RELAY_DNS_RESOLVER: "8.8.8.8"
    RELAY_DEFAULT_CONNECT_TIMEOUT: "30"
    RELAY_DEFAULT_READ_TIMEOUT: "120"
    RELAY_MAX_INSPECT_BYTES: "8388608"
    RELAY_TELEMETRY_METRICS_ENABLED: "true"
  # OTLP telemetry endpoint (host:port). Used by the NetworkPolicy egress allow-list.
  telemetry:
    otlpEndpoint: ""
    # host and port broken out for the NetworkPolicy egress rule.
    otlpHost: ""
    otlpPort: 4317

# --- PII master-key Secret (PROJECT.md §13.2, §8.3, D4) ---
# Created create-if-absent by a pre-install hook; NEVER regenerated on `helm upgrade`.
# Keyring JSON: {"<epoch_int>": "<base64(32-byte key)>"}. Rotate by adding a new epoch and setting
# activeEpoch; retain prior epochs so existing tokens stay decryptable.
piiKeyring:
  enabled: true
  # Name of the Secret holding the keyring file. Defaults to <fullname>-pii-keyring.
  secretName: ""
  # Key within the Secret and the mount path wired to RELAY_PII_KEYRING_FILE.
  key: keyring.json
  mountPath: /etc/wenrix/keys
  activeEpoch: 0
  # When true, a pre-install/pre-upgrade hook Job generates the key only if the Secret is absent.
  createIfAbsent: true

# --- Inbound TLS material (optional). Mounted from a Secret; base64(PEM). ---
tls:
  enabled: false
  secretName: ""

# --- Basic auth (optional). Credentials from a Secret, never from values/ConfigMap. ---
basicAuth:
  enabled: true
  # Secret with keys `user` and `pass`. If empty, set RELAY_BASIC_AUTH_* another way.
  secretName: ""

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: "1000m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "512Mi"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  # Optional RPS-based scaling (requires metrics support in the cluster).
  targetRequestsPerSecond: 50

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Default-deny NetworkPolicy with an egress allow-list (PROJECT.md §13.5).
networkPolicy:
  enabled: true
  # CIDRs allowed to reach the relay (the Wenrix client source).
  ingressFromCIDRs: []
  # Namespace/pod selectors allowed ingress (alternative to CIDRs).
  ingressFromNamespaceSelectors: []
  # Extra egress CIDRs for channel hosts (channels resolved by DNS still need these).
  egressToCIDRs: []
  dnsPort: 53

serviceMonitor:
  # OFF by default: the app is OTLP-push only and exposes no Prometheus scrape endpoint yet.
  # Enable once a /metrics scrape surface exists (tracked as follow-up).
  enabled: false
  interval: 30s
  path: /metrics
  port: http

# Pod-level securityContext.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

# Container-level securityContext.
securityContext:
  runAsNonRoot: true
  runAsUser: 100
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

livenessProbe:
  httpGet:
    path: /liveness
    port: http
  initialDelaySeconds: 5
  periodSeconds: 30
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readiness
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}
