apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "wenrix-relay.fullname" . }}-config
  labels:
    {{- include "wenrix-relay.labels" . | nindent 4 }}
data:
  # Channel definitions only. Secrets are NEVER rendered here (PROJECT.md §13.5).
  relay.json: |-
    {{- dict "channels" .Values.config.channels | toPrettyJson | nindent 4 }}
