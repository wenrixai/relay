{{- if and .Values.piiKeyring.enabled .Values.piiKeyring.createIfAbsent (not .Values.piiKeyring.secretName) -}}
{{- /*
  PII master-key keyring, created create-if-absent (PROJECT.md §13.2, §8.3, D4).

  The `lookup` guard reuses the value of an already-existing Secret so `helm upgrade` NEVER
  regenerates the master key (which would orphan every outstanding ENC_ token). A fresh key is
  generated only on first install when no Secret exists. `helm.sh/resource-policy: keep` prevents
  deletion on uninstall for the same reason. To rotate, add a new epoch to the keyring and set
  piiKeyring.activeEpoch — never remove an epoch still present in outstanding tokens.

  If you manage the keyring Secret externally, set piiKeyring.secretName and this template is skipped.
*/ -}}
{{- $name := include "wenrix-relay.piiKeyringSecretName" . -}}
{{- $key := .Values.piiKeyring.key -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "wenrix-relay.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing (hasKey $existing.data $key) }}
  # Reuse the existing key material — do not regenerate on upgrade.
  {{ $key }}: {{ index $existing.data $key }}
  {{- else }}
  # First install: generate a 32-byte master key under the active epoch.
  {{ $key }}: {{ printf "{%q:%q}" (toString (int .Values.piiKeyring.activeEpoch)) (randBytes 32) | b64enc }}
  {{- end }}
{{- end }}
