AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Wenrix Channel Relay — highly available ECS Fargate service across two AZs behind an HTTPS ALB,
  with least-privilege IAM, Secrets Manager for the PII keyring, autoscaling, and CloudWatch logs.

Parameters:
  ImageUri:
    Type: String
    Description: Fully qualified relay image (e.g. ghcr.io/wenrixai/wenrix-relay:v0.1.0).
  WenrixIngressCidr:
    Type: String
    Description: CIDR allowed to reach the ALB on HTTPS (the Wenrix client source). Do not use 0.0.0.0/0.
    AllowedPattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$
  CertificateArn:
    Type: String
    Description: ACM certificate ARN for the HTTPS listener.
  RelayConfigJson:
    Type: String
    Description: Channel configuration JSON (no secrets).
    Default: '{"channels":[]}'
    NoEcho: true
  PiiKeyEpochActive:
    Type: Number
    Default: 0
  BasicAuthEnabled:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
  BasicAuthUser:
    Type: String
    Description: Basic auth username. Required when BasicAuthEnabled=true.
    Default: ""
    NoEcho: true
  BasicAuthPass:
    Type: String
    Description: Basic auth password. Required when BasicAuthEnabled=true.
    Default: ""
    NoEcho: true
  OtlpEndpoint:
    Type: String
    Description: OTLP/gRPC endpoint. Use http:// for a plaintext collector. Empty disables export.
    Default: ""
  ContainerPort:
    Type: Number
    Default: 8080
  TaskCpu:
    Type: Number
    Default: 1024
  TaskMemory:
    Type: Number
    Default: 2048
  DesiredCount:
    Type: Number
    Default: 2
  MinCapacity:
    Type: Number
    Default: 2
  MaxCapacity:
    Type: Number
    Default: 10
  VpcCidr:
    Type: String
    Default: 10.20.0.0/16
  LogRetentionDays:
    Type: Number
    Default: 30

Rules:
  BasicAuthRequiresCredentials:
    RuleCondition: !Equals [!Ref BasicAuthEnabled, "true"]
    Assertions:
      - Assert: !Not [!Equals [!Ref BasicAuthUser, ""]]
        AssertDescription: BasicAuthUser is required when BasicAuthEnabled is true.
      - Assert: !Not [!Equals [!Ref BasicAuthPass, ""]]
        AssertDescription: BasicAuthPass is required when BasicAuthEnabled is true.

Conditions:
  IsBasicAuthEnabled: !Equals [!Ref BasicAuthEnabled, "true"]

Resources:
  # --- Networking ---
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Ref AWS::StackName }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 4, 8]]
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Tier, Value: public }]

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 4, 8]]
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Tier, Value: public }]

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 4, 8]]
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags: [{ Key: Tier, Value: private }]

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [3, !Cidr [!Ref VpcCidr, 4, 8]]
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags: [{ Key: Tier, Value: private }]

  NatEip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnet1

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # --- Security groups ---
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB ingress from the Wenrix client source only.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref WenrixIngressCidr
          Description: HTTPS from Wenrix client

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Relay tasks accept traffic only from the ALB.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref ContainerPort
          ToPort: !Ref ContainerPort
          SourceSecurityGroupId: !Ref AlbSecurityGroup
          Description: From ALB

  # --- Load balancer ---
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      SecurityGroups: [!Ref AlbSecurityGroup]
      Subnets: [!Ref PublicSubnet1, !Ref PublicSubnet2]
      LoadBalancerAttributes:
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: "true" }
        - { Key: idle_timeout.timeout_seconds, Value: "130" }

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      Port: !Ref ContainerPort
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /readiness
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: "200" }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "120" }

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{ CertificateArn: !Ref CertificateArn }]
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # --- Secret ---
  PiiKeyringSecret:
    Type: AWS::SecretsManager::Secret
    # Never orphan outstanding tokens: keep the key on stack deletion.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "${AWS::StackName}/pii-keyring"
      Description: PII master keyring for the Wenrix relay.
      SecretString: "{}"

  BasicAuthSecret:
    Type: AWS::SecretsManager::Secret
    Condition: IsBasicAuthEnabled
    Properties:
      Name: !Sub "${AWS::StackName}/basic-auth"
      Description: Basic auth credentials for the Wenrix relay.
      SecretString: !Sub '{"user":"${BasicAuthUser}","pass":"${BasicAuthPass}"}'

  # --- Logging ---
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${AWS::StackName}"
      RetentionInDays: !Ref LogRetentionDays

  # --- IAM ---
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-relay-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  !If
                    - IsBasicAuthEnabled
                    - [!Ref PiiKeyringSecret, !Ref BasicAuthSecret]
                    - [!Ref PiiKeyringSecret]

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole

  # --- ECS ---
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref AWS::StackName
      ClusterSettings:
        - { Name: containerInsights, Value: enabled }

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Ref AWS::StackName
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      Volumes:
        - Name: tmp
      ContainerDefinitions:
        - Name: relay
          Image: !Ref ImageUri
          Essential: true
          User: "100"
          ReadonlyRootFilesystem: true
          EntryPoint: ["/bin/sh", "-c"]
          Command:
            - "printf '%s' \"$RELAY_CONFIG_JSON\" > /tmp/relay.json && exec channel-relay"
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp
          Environment:
            - { Name: RELAY_CONFIG_FILE, Value: /tmp/relay.json }
            - { Name: RELAY_CONFIG_JSON, Value: !Ref RelayConfigJson }
            - { Name: RELAY_PORT, Value: !Ref ContainerPort }
            - { Name: RELAY_PII_KEY_EPOCH_ACTIVE, Value: !Ref PiiKeyEpochActive }
            - { Name: RELAY_BASIC_AUTH_ENABLED, Value: !Ref BasicAuthEnabled }
            - { Name: RELAY_OTLP_ENDPOINT, Value: !Ref OtlpEndpoint }
          Secrets:
            - { Name: RELAY_PII_KEYRING, ValueFrom: !Ref PiiKeyringSecret }
            - !If
              - IsBasicAuthEnabled
              - { Name: RELAY_BASIC_AUTH_USER, ValueFrom: !Sub "${BasicAuthSecret}:user::" }
              - !Ref AWS::NoValue
            - !If
              - IsBasicAuthEnabled
              - { Name: RELAY_BASIC_AUTH_PASS, ValueFrom: !Sub "${BasicAuthSecret}:pass::" }
              - !Ref AWS::NoValue
          MountPoints:
            - { SourceVolume: tmp, ContainerPath: /tmp, ReadOnly: false }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: relay
          StopTimeout: 120
          HealthCheck:
            Command:
              - CMD-SHELL
              - !Sub "wget -q -O - http://127.0.0.1:${ContainerPort}/liveness || exit 1"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 15

  Service:
    Type: AWS::ECS::Service
    DependsOn: HttpsListener
    Properties:
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      HealthCheckGracePeriodSeconds: 60
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
          SecurityGroups: [!Ref TaskSecurityGroup]
      LoadBalancers:
        - ContainerName: relay
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref TargetGroup

  # --- Autoscaling ---
  ScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: !Ref MaxCapacity
      MinCapacity: !Ref MinCapacity
      ResourceId: !Sub "service/${Cluster}/${Service.Name}"
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs

  CpuScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub "${AWS::StackName}-cpu"
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: 70

  RequestScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub "${AWS::StackName}-alb-requests"
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ALBRequestCountPerTarget
          ResourceLabel: !Sub "${LoadBalancer.LoadBalancerFullName}/${TargetGroup.TargetGroupFullName}"
        TargetValue: 3000

Outputs:
  AlbDnsName:
    Description: Public DNS name of the relay load balancer.
    Value: !GetAtt LoadBalancer.DNSName
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  LogGroup:
    Value: !Ref LogGroup
  PiiKeyringSecretArn:
    Value: !Ref PiiKeyringSecret
  BasicAuthSecretArn:
    Condition: IsBasicAuthEnabled
    Value: !Ref BasicAuthSecret
