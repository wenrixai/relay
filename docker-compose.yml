services:
  relay:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      RELAY_CONFIG_FILE: /etc/wenrix/relay.json
    volumes:
      - ./deployment/relay.example.json:/etc/wenrix/relay.json:ro
    depends_on:
      - mock-channel

  mock-channel:
    build:
      context: .
      dockerfile: Dockerfile.mockserver
    expose:
      - "9000"
